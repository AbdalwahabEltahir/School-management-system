name: CI

# Build and test on every push and pull request to main.
# Render deploys main only after these checks pass (autoDeployTrigger: checksPass in render.yaml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sijill
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The integration tests start PostgreSQL with Testcontainers; Docker is already on the runner.
      - name: Build and run all tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: sijill/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the same image Render builds, so a broken Dockerfile is caught before a deploy.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: sijill
          file: sijill/Dockerfile
          push: false
          tags: sijill:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Starts and signs in (demo profile)
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sijill
          POSTGRES_USER: sijill
          POSTGRES_PASSWORD: sijill_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sijill -d sijill"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package the app
        working-directory: sijill
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package

      # Same settings as the Render demo: seeded demo school, test sign-in on, Google off.
      - name: Start the app
        working-directory: sijill
        env:
          SPRING_PROFILES_ACTIVE: dev
          SIJILL_BOOTSTRAP_ENABLED: "false"
          SIJILL_GOOGLE_DRIVE_ENABLED: "false"
          SIJILL_JOBS_ENABLED: "false"
          SIJILL_SIGNIN_TEST_MODE: "true"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: sijill
          DB_USERNAME: sijill
          DB_PASSWORD: sijill_ci
          PORT: "8080"
        run: nohup java -jar target/sijill-0.0.1-SNAPSHOT.jar > app.log 2>&1 &

      - name: Wait until healthy
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "App did not become healthy"; tail -n 80 sijill/app.log; exit 1

      - name: Every demo role can sign in by name
        run: |
          set -e
          for name in Lina Omar Reem Huda Sara Amal Maha; do
            jar=$(mktemp)
            curl -s -c "$jar" -b "$jar" -o /dev/null http://localhost:8080/api/auth/options
            token=$(grep XSRF "$jar" | awk '{print $7}')
            curl -sf -c "$jar" -b "$jar" -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$name\"}" http://localhost:8080/api/auth/test/signin > /dev/null
            curl -sf -b "$jar" http://localhost:8080/api/me | grep -q '"role"'
            echo "signed in as $name"
          done

      - name: Show the app log on failure
        if: failure()
        run: tail -n 120 sijill/app.log
