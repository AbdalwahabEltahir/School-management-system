# Render Blueprint: one web service (the Sijill app in Docker) and one Postgres database.
#
# This is the "real accounts" setup: the app runs without the demo seed. The database is filled by copying a local
# database across (scripts/copy-db-to-render.ps1), which brings the people, files, issues and the saved Google
# connection. On a completely empty database the first start creates the organisation and the accounts listed under
# sijill.bootstrap in application.yml, so nobody is locked out.
services:
  - type: web
    name: sijill
    runtime: docker
    dockerfilePath: ./sijill/Dockerfile
    dockerContext: ./sijill
    plan: free
    autoDeployTrigger: checksPass       # deploy main only after the GitHub Actions checks pass
    healthCheckPath: /actuator/health
    envVars:
      - key: TZ
        value: Asia/Qatar               # the saved Google token times are in Qatar time (no timezone stored)
      - key: SIJILL_GOOGLE_DRIVE_ENABLED
        value: "true"                   # read the Drive of the accounts that signed in
      - key: SIJILL_JOBS_ENABLED
        value: "true"                   # nightly check, reminders (the free service only runs them while awake)
      - key: SIJILL_SIGNIN_TEST_MODE
        value: "true"                   # TESTING ONLY: sign in by name, no password. Set to false for real use.
      - key: SIJILL_DEMO_NETWORK
        value: "true"                   # adds invented Schools C-F so the leadership dashboard looks full. Remove for real use.
      - key: GOOGLE_CLIENT_ID
        sync: false                     # set in the Render dashboard, never in Git
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DB_HOST
        fromDatabase: { name: sijill-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: sijill-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: sijill-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: sijill-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: sijill-db, property: password }

databases:
  - name: sijill-db
    plan: free
    databaseName: sijill
    user: sijill
