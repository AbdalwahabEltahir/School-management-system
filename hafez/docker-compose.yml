services:
  db:
    image: postgres:16-alpine
    container_name: sijill-postgres
    environment:
      POSTGRES_DB: sijill
      POSTGRES_USER: sijill
      POSTGRES_PASSWORD: sijill_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sijill -d sijill"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
